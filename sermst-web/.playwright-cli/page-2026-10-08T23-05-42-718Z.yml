            - generic [ref=f1e52]: Orçamento de LTCAT
            - generic [ref=f1e53]: 7 min de leitura
          - heading "Quanto custa um LTCAT? Veja o que define o orçamento" [level=1] [ref=f1e57]
          - paragraph [ref=f1e58]: O preço de um LTCAT depende das condições de trabalho que precisam ser avaliadas e do escopo técnico solicitado. Para comparar propostas, considere estabelecimentos, atividades, grupos expostos, necessidade de levantamento em campo, medições aplicáveis e responsabilidade técnica — não apenas o número de empregados.
          - paragraph [ref=f1e64]:
            - text: Por
            - link "Felipe Sannino" [ref=f1e65] [cursor=pointer]:
              - /url: https://sermst.com.br/equipe/felipe-sannino
            - text: · Advogado - Direito do Trabalho e SST · OAB/SP 430.824
          - generic [ref=f1e66]:
            - generic [ref=f1e67]: "Última revisão: 8 de outubro de 2026"
            - generic [ref=f1e71]: Publicado em 8 de outubro de 2026
      - generic [ref=f1e73]:
        - article [ref=f1e74]:
          - generic [ref=f1e76]:
            - generic [ref=f1e77]:
              - paragraph [ref=f1e78]: Resposta direta
              - paragraph [ref=f1e80]:
                - text: Não existe um valor único de LTCAT que sirva para todas as empresas. A proposta deve informar quais unidades, atividades e exposições serão avaliadas, qual metodologia será usada e se visitas ou medições estão previstas. A empresa também precisa manter o laudo atualizado conforme as condições ambientais e os dados que fundamentam as informações previdenciárias. Consulte o
                - link "art. 58 da Lei nº 8.213/1991" [ref=f1e81] [cursor=pointer]:
                  - /url: https://www.planalto.gov.br/ccivil_03/leis/l8213compilado.htm
                - text: .
