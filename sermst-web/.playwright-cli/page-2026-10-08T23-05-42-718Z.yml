                  - /url: /normas/nr-15-insalubridade
                - text: .
          - generic [ref=f1e153]:
            - generic [ref=f1e154]:
              - generic [ref=f1e155]: "05"
              - heading "Quais dados reunir antes de pedir um orçamento" [level=2] [ref=f1e156]
            - generic [ref=f1e157]:
              - paragraph [ref=f1e158]: "Organize, quando disponíveis:"
              - list [ref=f1e159]:
                - listitem [ref=f1e160]: endereços e atividades de cada estabelecimento;
                - listitem [ref=f1e161]: relação de funções, tarefas e setores;
                - listitem [ref=f1e162]: processos, equipamentos, produtos e agentes presentes;
                - listitem [ref=f1e163]: PGR, avaliações ambientais, LTCAT e PPP existentes;
                - listitem [ref=f1e164]: registros de EPI e EPC e alterações recentes na operação;
                - listitem [ref=f1e165]: informações sobre avaliações ou medições anteriores.
              - paragraph [ref=f1e166]:
                - text: Com esses dados, o prestador pode esclarecer o que ainda precisa ser levantado. Conheça o
