          - generic [ref=f1e106]:
            - generic [ref=f1e107]:
              - generic [ref=f1e108]: "01"
              - heading "O que faz o preço do LTCAT variar?" [level=2] [ref=f1e109]
            - generic [ref=f1e110]:
              - paragraph [ref=f1e111]: O trabalho pode variar conforme o número de estabelecimentos, os processos realizados em cada local, as funções e os grupos de trabalhadores expostos, os agentes identificados e os documentos já disponíveis. Operações distintas dentro da mesma empresa podem exigir levantamentos diferentes.
              - paragraph [ref=f1e112]: Também influenciam o orçamento as visitas técnicas, a necessidade de avaliação quantitativa para determinados agentes, o deslocamento, a análise dos registros de proteção e a organização dos dados que sustentam o PPP e o evento S-2240. A necessidade de cada etapa deve decorrer das condições avaliadas e do escopo, não de um pacote presumido.
          - generic [ref=f1e114]:
            - generic [ref=f1e115]:
              - generic [ref=f1e116]: "02"
              - heading "Número de empregados não define o escopo sozinho" [level=2] [ref=f1e117]
            - generic [ref=f1e118]:
              - paragraph [ref=f1e119]: A quantidade de trabalhadores ajuda a dimensionar a operação, mas não substitui a análise de atividades, ambientes e exposições. Uma empresa menor pode ter processos variados ou agentes que demandem investigação específica; uma empresa maior pode ter ambientes e funções semelhantes entre si.
              - paragraph [ref=f1e120]: Por isso, desconfie de comparações feitas apenas por trabalhador ou por CNPJ. Confirme se todas as propostas cobrem os mesmos estabelecimentos, grupos de exposição, avaliações e entregáveis.
          - generic [ref=f1e122]:
            - generic [ref=f1e123]:
              - generic [ref=f1e124]: "03"
              - heading "Como comparar propostas de LTCAT" [level=2] [ref=f1e125]
            - generic [ref=f1e126]:
              - paragraph [ref=f1e127]: "Peça que cada proposta esclareça os seguintes pontos:"
              - list [ref=f1e128]:
                - listitem [ref=f1e129]:
                  - strong [ref=f1e130]: "Unidades e atividades:"
                  - text: quais endereços e processos estão incluídos.
                - listitem [ref=f1e131]:
                  - strong [ref=f1e132]: "Grupos avaliados:"
                  - text: funções, tarefas e exposições que serão consideradas.
                - listitem [ref=f1e133]:
                  - strong [ref=f1e134]: "Metodologia:"
                  - text: levantamentos e medições previstos, quando aplicáveis, e condições em que serão realizados.
                - listitem [ref=f1e135]:
                  - strong [ref=f1e136]: "Responsabilidade técnica:"
                  - text: profissional responsável e identificação no documento.
                - listitem [ref=f1e137]:
                  - strong [ref=f1e138]: "Entregas e limites:"
                  - text: laudo, registros de avaliação, revisões, deslocamentos e itens cobrados à parte.
                - listitem [ref=f1e139]:
                  - strong [ref=f1e140]: "Prazo e dados de base:"
                  - text: informações que a empresa precisa fornecer e como mudanças futuras serão tratadas.
              - paragraph [ref=f1e141]: Um orçamento mais baixo pode ter um escopo menor. Compare as entregas e os limites por escrito antes de decidir; o valor não demonstra, sozinho, a adequação técnica do trabalho.
          - generic [ref=f1e143]:
            - generic [ref=f1e144]:
              - generic [ref=f1e145]: "04"
              - heading "LTCAT, PGR e laudo de insalubridade têm finalidades diferentes" [level=2] [ref=f1e146]
            - generic [ref=f1e147]:
              - paragraph [ref=f1e148]: O LTCAT documenta condições ambientais para fins previdenciários e serve de base para informações do PPP, conforme o caso. O PGR organiza o gerenciamento dos riscos ocupacionais; já o laudo de insalubridade avalia o enquadramento trabalhista segundo a NR-15. Um documento não substitui automaticamente o outro.
              - paragraph [ref=f1e149]:
                - text: Para entender as diferenças e o processo de avaliação, consulte o
                - link "guia do PPP eletrônico" [ref=f1e150] [cursor=pointer]:
