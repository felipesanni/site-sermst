          - heading "O que faz um encarregado? Função, responsabilidades e cuidados de SST" [level=1] [ref=f1e27]
          - paragraph [ref=f1e28]: "Guia direto para gestores, RH e quem está estruturando o cargo: o que esse profissional faz na prática, quais responsabilidades assume, que perfil costuma funcionar e onde SST entra nessa decisão."
      - generic [ref=f1e30]:
        - article [ref=f1e31]:
          - generic [ref=f1e32]:
            - heading "O que é a função de encarregado" [level=2] [ref=f1e33]
            - paragraph [ref=f1e34]: O encarregado é a primeira camada formal de liderança operacional dentro da empresa. É quem está no campo, no chão de fábrica, na obra ou no ponto de operação coordenando a execução do trabalho da equipe diretamente. Diferente do operador, tem responsabilidade sobre o resultado do grupo. Diferente do supervisor, está com a mão na execução todo dia.
            - paragraph [ref=f1e35]: "Em empresas familiares, é o cargo mais subestimado e mais decisivo: subestimado porque parece \"só mais um da equipe\", decisivo porque é quem traduz o plano da diretoria em comportamento real no turno."
          - generic [ref=f1e37]:
            - paragraph [ref=f1e38]: Resposta direta
            - paragraph [ref=f1e39]:
              - text: Encarregado é um cargo de
              - strong [ref=f1e40]: liderança operacional
              - text: que costuma coordenar a equipe no campo, acompanhar procedimentos e comunicar ocorrências do turno. A descrição exata depende da estrutura e das atividades de cada empresa.
          - heading "Responsabilidades reais do encarregado" [level=2] [ref=f1e42]
          - generic [ref=f1e43]:
            - generic [ref=f1e50]:
              - paragraph [ref=f1e51]: Liderança operacional direta
              - paragraph [ref=f1e52]: Coordena a equipe na execução das atividades, distribui tarefas e cobra resultado dentro do plano do dia.
            - generic [ref=f1e59]:
              - paragraph [ref=f1e60]: Treinamento e integração
              - paragraph [ref=f1e61]: Apoia a integração de novos colaboradores e o reforço de procedimentos com quem já está na operação.
            - generic [ref=f1e68]:
              - paragraph [ref=f1e69]: Cumprimento de procedimentos
              - paragraph [ref=f1e70]: Acompanha a aplicação dos procedimentos operacionais e corrige desvios dentro de sua alçada.
            - generic [ref=f1e77]:
              - paragraph [ref=f1e78]: Segurança do trabalho na linha de frente
              - paragraph [ref=f1e79]: É o responsável imediato por exigir uso de EPI, observar comportamento de risco e reportar incidentes ao SESMT.
            - generic [ref=f1e86]:
              - paragraph [ref=f1e87]: Reporte de produtividade e ocorrências
              - paragraph [ref=f1e88]: Consolida indicadores do turno (produção, falhas, paradas, acidentes) e leva à supervisão.
            - generic [ref=f1e95]:
              - paragraph [ref=f1e96]: Mediação de conflitos da equipe
              - paragraph [ref=f1e97]: Resolve atritos do dia a dia operacional antes de escalar para RH ou supervisão.
          - generic [ref=f1e98]:
            - heading "Perfil ideal do encarregado" [level=2] [ref=f1e99]
            - paragraph [ref=f1e100]: "Não existe um modelo único. Alguns critérios ajudam a selecionar e desenvolver esse profissional:"
            - list [ref=f1e101]:
              - listitem [ref=f1e102]: Experiência comprovada na atividade que vai liderar (não dá para liderar o que não conhece)
              - listitem [ref=f1e103]: Comunicação direta, com fala simples e escrita clara
              - listitem [ref=f1e104]: Postura de exemplo (chega no horário, usa EPI, segue procedimento)
              - listitem [ref=f1e105]: Tomada de decisão sob pressão sem travar o turno
              - listitem [ref=f1e106]: Conhecimento das NRs aplicáveis à atividade da equipe
              - listitem [ref=f1e107]: Capacidade de dar e receber feedback sem virar conflito pessoal
            - heading "4 erros comuns de gestores ao definir o cargo" [level=2] [ref=f1e108]
          - generic [ref=f1e109]:
            - generic [ref=f1e115]:
              - paragraph [ref=f1e116]: Promover por tempo de casa, não por capacidade de liderar
              - paragraph [ref=f1e117]: "O melhor operador raramente é o melhor encarregado. Liderar exige habilidade de gente, não só técnica. Promoção mal feita gera duas perdas: o operador deixa de produzir e a equipe vira o caos."
            - generic [ref=f1e123]:
              - paragraph [ref=f1e124]: Não treinar o encarregado em SST
              - paragraph [ref=f1e125]: A conduta do encarregado pode ser analisada em uma investigação de acidente, conforme suas atribuições, autonomia e participação no fato. Por isso, a empresa deve definir o papel e oferecer capacitação compatível.
            - generic [ref=f1e131]:
              - paragraph [ref=f1e132]: Confundir com supervisor
              - paragraph [ref=f1e133]: Encarregado é hierarquia operacional direta. Supervisor coordena encarregados. Misturar atribuições gera desorganização, conflito de papéis e perda de produtividade.
            - generic [ref=f1e139]:
              - paragraph [ref=f1e140]: Esquecer do exame ocupacional periódico
              - paragraph [ref=f1e141]: Cargo de liderança não dispensa PCMSO. Encarregado precisa de exame admissional, periódico e demissional como qualquer colaborador. Ignorar o fluxo pode gerar inconsistência no eSocial e risco de autuação.
          - generic [ref=f1e142]:
            - heading "Onde SST entra nas atribuições do encarregado" [level=2] [ref=f1e143]
            - paragraph [ref=f1e144]: O encarregado costuma estar próximo da execução e pode ter atribuições como interromper uma tarefa insegura, cobrar o uso de proteção e comunicar desvios. Essas responsabilidades precisam estar descritas e acompanhadas de autoridade e treinamento compatíveis.
            - paragraph [ref=f1e145]: Em caso de acidente, a investigação pode analisar o que o encarregado sabia, o que estava autorizado a fazer e quais providências tomou. A responsabilização pessoal não é automática e depende da conduta, do nexo causal e das circunstâncias. A empresa continua responsável por organizar o trabalho e oferecer meios de prevenção.
            - paragraph [ref=f1e146]: "Isso significa três coisas concretas para quem está estruturando o cargo agora:"
            - list [ref=f1e147]:
              - listitem [ref=f1e148]:
                - strong [ref=f1e149]: "Treinamento documentado:"
                - text: NR aplicável à atividade (NR-10 elétrica, NR-18 construção, NR-35 altura, NR-12 máquinas, etc.) com lista de presença, certificado e renovação periódica.
              - listitem [ref=f1e150]:
                - strong [ref=f1e151]: "PCMSO coerente:"
                - text: exames ocupacionais definidos conforme os riscos da função e eventos enviados ao eSocial quando exigidos.
              - listitem [ref=f1e152]:
                - strong [ref=f1e153]: "Procedimentos claros e assinados:"
                - text: ele precisa receber por escrito as instruções de trabalho, e a empresa precisa guardar a evidência.
            - paragraph [ref=f1e154]: Esses registros não impedem acidentes nem garantem resultado judicial. Eles ajudam a demonstrar como a função foi organizada e quais medidas foram efetivamente adotadas.
            - paragraph [ref=f1e155]: O grau de risco da atividade é uma das informações usadas para dimensionar estruturas como CIPA e SESMT, mas os exames e treinamentos dependem também dos riscos reais da função. A calculadora de CNAE e grau de risco ajuda no primeiro enquadramento.
            - paragraph [ref=f1e156]:
              - text: Para organizar essas frentes como uma rotina da empresa, veja também o guia de
              - link "gestão de SST" [ref=f1e157] [cursor=pointer]:
                - /url: /saude/gestao-sst
              - text: ", que explica como programas, exames, treinamentos e registros se relacionam."
            - heading "Perguntas frequentes sobre a função de encarregado" [level=2] [ref=f1e158]
          - generic [ref=f1e159]:
            - group [ref=f1e161]:
              - generic "Qual a diferença entre encarregado e supervisor? +" [ref=f1e162] [cursor=pointer]:
