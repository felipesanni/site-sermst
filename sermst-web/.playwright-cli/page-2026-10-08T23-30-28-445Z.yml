                - generic [ref=f1e164]: +
              - paragraph [ref=f1e166]: Em muitas empresas, o encarregado acompanha a execução diária da equipe, enquanto o supervisor coordena uma área, mais de um turno ou vários encarregados. A CLT não cria uma descrição universal para esses cargos; a diferença depende do organograma, da convenção coletiva e das tarefas realmente exercidas.
