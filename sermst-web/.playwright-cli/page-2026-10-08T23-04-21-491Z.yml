            - text: Orçamento de LTCAT
            - generic [ref=e59]: 7 min de leitura
          - heading "Quanto custa um LTCAT? Veja o que define o orçamento" [level=1] [ref=e63]
          - paragraph [ref=e64]: O preço de um LTCAT depende das condições de trabalho que precisam ser avaliadas e do escopo técnico solicitado. Para comparar propostas, considere estabelecimentos, atividades, grupos expostos, necessidade de levantamento em campo, medições aplicáveis e responsabilidade técnica — não apenas o número de empregados.
          - paragraph [ref=e70]:
            - text: Por
            - link "Felipe Sannino" [ref=e71] [cursor=pointer]:
              - /url: https://sermst.com.br/equipe/felipe-sannino
            - text: · Advogado - Direito do Trabalho e SST · OAB/SP 430.824
          - generic [ref=e72]:
            - generic [ref=e73]: "Última revisão: 8 de outubro de 2026"
            - generic [ref=e77]: Publicado em 8 de outubro de 2026
      - generic [ref=e79]:
        - article [ref=e80]:
          - generic [ref=e82]:
            - generic [ref=e83]:
              - paragraph [ref=e84]: Resposta direta
              - paragraph [ref=e86]:
                - text: Não existe um valor único de LTCAT que sirva para todas as empresas. A proposta deve informar quais unidades, atividades e exposições serão avaliadas, qual metodologia será usada e se visitas ou medições estão previstas. A empresa também precisa manter o laudo atualizado conforme as condições ambientais e os dados que fundamentam as informações previdenciárias. Consulte o
                - link "art. 58 da Lei nº 8.213/1991" [ref=e87] [cursor=pointer]:
                  - /url: https://www.planalto.gov.br/ccivil_03/leis/l8213compilado.htm
                - text: .
            - generic [ref=e88]:
              - paragraph [ref=e89]: Neste artigo
              - list [ref=e90]:
                - listitem [ref=e91]:
                  - link "01O que faz o preço do LTCAT variar?" [ref=e92] [cursor=pointer]:
                    - /url: "#o-que-faz-o-preco-do-ltcat-variar-1"
                - listitem [ref=e93]:
                  - link "02Número de empregados não define o escopo sozinho" [ref=e94] [cursor=pointer]:
                    - /url: "#numero-de-empregados-nao-define-o-escopo-sozinho-2"
                - listitem [ref=e95]:
                  - link "03Como comparar propostas de LTCAT" [ref=e96] [cursor=pointer]:
                    - /url: "#como-comparar-propostas-de-ltcat-3"
                - listitem [ref=e97]:
                  - link "04LTCAT, PGR e laudo de insalubridade têm finalidades diferentes" [ref=e98] [cursor=pointer]:
                    - /url: "#ltcat-pgr-e-laudo-de-insalubridade-tem-finalidades-diferentes-4"
                - listitem [ref=e99]:
                  - link "05Quais dados reunir antes de pedir um orçamento" [ref=e100] [cursor=pointer]:
                    - /url: "#quais-dados-reunir-antes-de-pedir-um-orcamento-5"
          - generic [ref=e102]:
            - generic [ref=e103]:
              - text: "01"
              - heading "O que faz o preço do LTCAT variar?" [level=2] [ref=e104]
            - generic [ref=e105]:
              - paragraph [ref=e106]: O trabalho pode variar conforme o número de estabelecimentos, os processos realizados em cada local, as funções e os grupos de trabalhadores expostos, os agentes identificados e os documentos já disponíveis. Operações distintas dentro da mesma empresa podem exigir levantamentos diferentes.
              - paragraph [ref=e107]: Também influenciam o orçamento as visitas técnicas, a necessidade de avaliação quantitativa para determinados agentes, o deslocamento, a análise dos registros de proteção e a organização dos dados que sustentam o PPP e o evento S-2240. A necessidade de cada etapa deve decorrer das condições avaliadas e do escopo, não de um pacote presumido.
          - generic [ref=e109]:
            - generic [ref=e110]:
              - text: "02"
              - heading "Número de empregados não define o escopo sozinho" [level=2] [ref=e111]
            - generic [ref=e112]:
              - paragraph [ref=e113]: A quantidade de trabalhadores ajuda a dimensionar a operação, mas não substitui a análise de atividades, ambientes e exposições. Uma empresa menor pode ter processos variados ou agentes que demandem investigação específica; uma empresa maior pode ter ambientes e funções semelhantes entre si.
              - paragraph [ref=e114]: Por isso, desconfie de comparações feitas apenas por trabalhador ou por CNPJ. Confirme se todas as propostas cobrem os mesmos estabelecimentos, grupos de exposição, avaliações e entregáveis.
          - generic [ref=e116]:
            - generic [ref=e117]:
              - text: "03"
              - heading "Como comparar propostas de LTCAT" [level=2] [ref=e118]
            - generic [ref=e119]:
              - paragraph [ref=e120]: "Peça que cada proposta esclareça os seguintes pontos:"
              - list [ref=e121]:
                - listitem [ref=e122]:
                  - strong [ref=e123]: "Unidades e atividades:"
                  - text: quais endereços e processos estão incluídos.
                - listitem [ref=e124]:
                  - strong [ref=e125]: "Grupos avaliados:"
                  - text: funções, tarefas e exposições que serão consideradas.
                - listitem [ref=e126]:
                  - strong [ref=e127]: "Metodologia:"
                  - text: levantamentos e medições previstos, quando aplicáveis, e condições em que serão realizados.
                - listitem [ref=e128]:
                  - strong [ref=e129]: "Responsabilidade técnica:"
                  - text: profissional responsável e identificação no documento.
                - listitem [ref=e130]:
                  - strong [ref=e131]: "Entregas e limites:"
                  - text: laudo, registros de avaliação, revisões, deslocamentos e itens cobrados à parte.
                - listitem [ref=e132]:
                  - strong [ref=e133]: "Prazo e dados de base:"
                  - text: informações que a empresa precisa fornecer e como mudanças futuras serão tratadas.
              - paragraph [ref=e134]: Um orçamento mais baixo pode ter um escopo menor. Compare as entregas e os limites por escrito antes de decidir; o valor não demonstra, sozinho, a adequação técnica do trabalho.
          - generic [ref=e136]:
            - generic [ref=e137]:
              - text: "04"
              - heading "LTCAT, PGR e laudo de insalubridade têm finalidades diferentes" [level=2] [ref=e138]
            - generic [ref=e139]:
              - paragraph [ref=e140]: O LTCAT documenta condições ambientais para fins previdenciários e serve de base para informações do PPP, conforme o caso. O PGR organiza o gerenciamento dos riscos ocupacionais; já o laudo de insalubridade avalia o enquadramento trabalhista segundo a NR-15. Um documento não substitui automaticamente o outro.
              - paragraph [ref=e141]:
                - text: Para entender as diferenças e o processo de avaliação, consulte o
                - link "guia do PPP eletrônico" [ref=e142] [cursor=pointer]:
                  - /url: /normas/ppp-eletronico
                - text: e a página sobre
                - link "insalubridade na NR-15" [ref=e143] [cursor=pointer]:
                  - /url: /normas/nr-15-insalubridade
                - text: .
          - generic [ref=e145]:
            - generic [ref=e146]:
              - text: "05"
              - heading "Quais dados reunir antes de pedir um orçamento" [level=2] [ref=e147]
            - generic [ref=e148]:
              - paragraph [ref=e149]: "Organize, quando disponíveis:"
              - list [ref=e150]:
                - listitem [ref=e151]: endereços e atividades de cada estabelecimento;
                - listitem [ref=e152]: relação de funções, tarefas e setores;
                - listitem [ref=e153]: processos, equipamentos, produtos e agentes presentes;
                - listitem [ref=e154]: PGR, avaliações ambientais, LTCAT e PPP existentes;
                - listitem [ref=e155]: registros de EPI e EPC e alterações recentes na operação;
                - listitem [ref=e156]: informações sobre avaliações ou medições anteriores.
              - paragraph [ref=e157]:
                - text: Com esses dados, o prestador pode esclarecer o que ainda precisa ser levantado. Conheça o
                - link "serviço de LTCAT previdenciário da SERMST" [ref=e158] [cursor=pointer]:
                  - /url: /servicos/ltcat-laudo-tecnico-previdenciario/sao-paulo
                - text: e confirme o escopo aplicável à empresa.
