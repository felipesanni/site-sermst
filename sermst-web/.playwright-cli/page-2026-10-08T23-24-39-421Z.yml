          - heading "O que faz um encarregado? Função, responsabilidades e cuidados de SST" [level=1] [ref=e50]
          - paragraph [ref=e51]: "Guia direto para gestores, RH e quem está estruturando o cargo: o que esse profissional faz na prática, quais responsabilidades assume, que perfil costuma funcionar e onde SST entra nessa decisão."
      - generic [ref=e53]:
        - article [ref=e54]:
          - generic [ref=e55]:
            - heading "O que é a função de encarregado" [level=2] [ref=e56]
            - paragraph [ref=e57]: O encarregado é a primeira camada formal de liderança operacional dentro da empresa. É quem está no campo, no chão de fábrica, na obra ou no ponto de operação coordenando a execução do trabalho da equipe diretamente. Diferente do operador, tem responsabilidade sobre o resultado do grupo. Diferente do supervisor, está com a mão na execução todo dia.
            - paragraph [ref=e58]: "Em empresas familiares, é o cargo mais subestimado e mais decisivo: subestimado porque parece \"só mais um da equipe\", decisivo porque é quem traduz o plano da diretoria em comportamento real no turno."
          - generic [ref=e60]:
            - paragraph [ref=e61]: Resposta direta
            - paragraph [ref=e62]:
              - text: Encarregado é um cargo de
              - strong [ref=e63]: liderança operacional
              - text: que costuma coordenar a equipe no campo, acompanhar procedimentos e comunicar ocorrências do turno. A descrição exata depende da estrutura e das atividades de cada empresa.
          - heading "Responsabilidades reais do encarregado" [level=2] [ref=e65]
          - generic [ref=e66]:
            - generic [ref=e73]:
              - paragraph [ref=e74]: Liderança operacional direta
              - paragraph [ref=e75]: Coordena a equipe na execução das atividades, distribui tarefas e cobra resultado dentro do plano do dia.
            - generic [ref=e82]:
              - paragraph [ref=e83]: Treinamento e integração
              - paragraph [ref=e84]: Apoia a integração de novos colaboradores e o reforço de procedimentos com quem já está na operação.
            - generic [ref=e91]:
              - paragraph [ref=e92]: Cumprimento de procedimentos
              - paragraph [ref=e93]: Acompanha a aplicação dos procedimentos operacionais e corrige desvios dentro de sua alçada.
            - generic [ref=e100]:
              - paragraph [ref=e101]: Segurança do trabalho na linha de frente
              - paragraph [ref=e102]: É o responsável imediato por exigir uso de EPI, observar comportamento de risco e reportar incidentes ao SESMT.
            - generic [ref=e109]:
              - paragraph [ref=e110]: Reporte de produtividade e ocorrências
              - paragraph [ref=e111]: Consolida indicadores do turno (produção, falhas, paradas, acidentes) e leva à supervisão.
            - generic [ref=e118]:
              - paragraph [ref=e119]: Mediação de conflitos da equipe
              - paragraph [ref=e120]: Resolve atritos do dia a dia operacional antes de escalar para RH ou supervisão.
          - generic [ref=e121]:
            - heading "Perfil ideal do encarregado" [level=2] [ref=e122]
            - paragraph [ref=e123]: "Não existe um modelo único. Alguns critérios ajudam a selecionar e desenvolver esse profissional:"
            - list [ref=e124]:
              - listitem [ref=e125]: Experiência comprovada na atividade que vai liderar (não dá para liderar o que não conhece)
              - listitem [ref=e126]: Comunicação direta, com fala simples e escrita clara
              - listitem [ref=e127]: Postura de exemplo (chega no horário, usa EPI, segue procedimento)
              - listitem [ref=e128]: Tomada de decisão sob pressão sem travar o turno
              - listitem [ref=e129]: Conhecimento das NRs aplicáveis à atividade da equipe
              - listitem [ref=e130]: Capacidade de dar e receber feedback sem virar conflito pessoal
            - heading "4 erros comuns de gestores ao definir o cargo" [level=2] [ref=e131]
          - generic [ref=e132]:
            - generic [ref=e138]:
              - paragraph [ref=e139]: Promover por tempo de casa, não por capacidade de liderar
              - paragraph [ref=e140]: "O melhor operador raramente é o melhor encarregado. Liderar exige habilidade de gente, não só técnica. Promoção mal feita gera duas perdas: o operador deixa de produzir e a equipe vira o caos."
            - generic [ref=e146]:
              - paragraph [ref=e147]: Não treinar o encarregado em SST
              - paragraph [ref=e148]: A conduta do encarregado pode ser analisada em uma investigação de acidente, conforme suas atribuições, autonomia e participação no fato. Por isso, a empresa deve definir o papel e oferecer capacitação compatível.
            - generic [ref=e154]:
              - paragraph [ref=e155]: Confundir com supervisor
              - paragraph [ref=e156]: Encarregado é hierarquia operacional direta. Supervisor coordena encarregados. Misturar atribuições gera desorganização, conflito de papéis e perda de produtividade.
            - generic [ref=e162]:
              - paragraph [ref=e163]: Esquecer do exame ocupacional periódico
              - paragraph [ref=e164]: Cargo de liderança não dispensa PCMSO. Encarregado precisa de exame admissional, periódico e demissional como qualquer colaborador. Ignorar o fluxo pode gerar inconsistência no eSocial e risco de autuação.
          - generic [ref=e165]:
            - heading "Onde SST entra nas atribuições do encarregado" [level=2] [ref=e166]
            - paragraph [ref=e167]: O encarregado costuma estar próximo da execução e pode ter atribuições como interromper uma tarefa insegura, cobrar o uso de proteção e comunicar desvios. Essas responsabilidades precisam estar descritas e acompanhadas de autoridade e treinamento compatíveis.
            - paragraph [ref=e168]: Em caso de acidente, a investigação pode analisar o que o encarregado sabia, o que estava autorizado a fazer e quais providências tomou. A responsabilização pessoal não é automática e depende da conduta, do nexo causal e das circunstâncias. A empresa continua responsável por organizar o trabalho e oferecer meios de prevenção.
            - paragraph [ref=e169]: "Isso significa três coisas concretas para quem está estruturando o cargo agora:"
            - list [ref=e170]:
              - listitem [ref=e171]:
                - strong [ref=e172]: "Treinamento documentado:"
                - text: NR aplicável à atividade (NR-10 elétrica, NR-18 construção, NR-35 altura, NR-12 máquinas, etc.) com lista de presença, certificado e renovação periódica.
              - listitem [ref=e173]:
                - strong [ref=e174]: "PCMSO coerente:"
                - text: exames ocupacionais definidos conforme os riscos da função e eventos enviados ao eSocial quando exigidos.
              - listitem [ref=e175]:
                - strong [ref=e176]: "Procedimentos claros e assinados:"
                - text: ele precisa receber por escrito as instruções de trabalho, e a empresa precisa guardar a evidência.
            - paragraph [ref=e177]: Esses registros não impedem acidentes nem garantem resultado judicial. Eles ajudam a demonstrar como a função foi organizada e quais medidas foram efetivamente adotadas.
            - paragraph [ref=e178]: O grau de risco da atividade é uma das informações usadas para dimensionar estruturas como CIPA e SESMT, mas os exames e treinamentos dependem também dos riscos reais da função. A calculadora de CNAE e grau de risco ajuda no primeiro enquadramento.
            - paragraph [ref=e179]:
              - text: Para organizar essas frentes como uma rotina da empresa, veja também o guia de
              - link "gestão de SST" [ref=e180] [cursor=pointer]:
                - /url: /saude/gestao-sst
              - text: ", que explica como programas, exames, treinamentos e registros se relacionam."
            - heading "Perguntas frequentes sobre a função de encarregado" [level=2] [ref=e181]
