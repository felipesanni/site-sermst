                - generic [ref=f2e187]: +
              - paragraph [ref=f2e189]: Em muitas empresas, o encarregado acompanha a execução diária da equipe, enquanto o supervisor coordena uma área, mais de um turno ou vários encarregados. A CLT não cria uma descrição universal para esses cargos; a diferença depende do organograma, da convenção coletiva e das tarefas realmente exercidas.
