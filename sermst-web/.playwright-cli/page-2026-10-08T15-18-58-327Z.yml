                  - heading "Exame Admissional | Clínica de Medicina do Trabalho" [level=4] [ref=f1e148]
                  - paragraph [ref=f1e149]: A SERMST é uma clínica de exames admissionais em São Paulo para empresas que precisam de ASO, exames complementares e liberação ágil sem atrasar a contratação.
