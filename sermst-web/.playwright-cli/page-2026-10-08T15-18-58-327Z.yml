                  - heading "Exame Demissional | Clínica de Medicina do Trabalho" [level=4] [ref=f1e162]
                  - paragraph [ref=f1e163]: Precisa agendar exame demissional em São Paulo? A SERMST atende empresas no Centro, emite o ASO demissional e organiza o exame conforme o PCMSO, os riscos da função e o prazo da NR-07.
                  - generic [ref=f1e164]: Ver detalhes do serviço
