                  - /url: /servicos/empresa-seguranca-do-trabalho
                  - heading "Empresa de Segurança do Trabalho | Gestão de SST para Empresas" [level=4] [ref=f1e221]
                  - paragraph [ref=f1e222]: A SERMST atende empresas que precisam organizar PGR, PCMSO, LTCAT, exames ocupacionais, treinamentos e eSocial em um fluxo de SST mais coerente, previsível e seguro para o RH.
                  - generic [ref=f1e223]: Ver detalhes do serviço
                - link [ref=f1e227] [cursor=pointer]:
                  - /url: /servicos/pcmso-nr07-programa
                  - heading "PCMSO (NR-07) | Gestão de Saúde Ocupacional Especializada" [level=4] [ref=f1e235]
                  - paragraph [ref=f1e236]: O PCMSO precisa refletir os riscos e as funções da empresa. A SERMST elabora e coordena o programa, define exames e periodicidades e mantém as informações alinhadas aos ASOs e ao eSocial.
                  - generic [ref=f1e237]: Ver detalhes do serviço
                - link [ref=f1e241] [cursor=pointer]:
                  - /url: /servicos/pgr-nr01-gerenciamento-riscos
                  - heading "PGR (NR-01) | Engenharia de Segurança e Levantamento de Riscos" [level=4] [ref=f1e249]
                  - paragraph [ref=f1e250]: Sua empresa precisa de PGR coerente com a operação real, e não de um documento padrão. A SERMST realiza vistoria técnica, inventário de riscos e plano de ação com foco em conformidade, prevenção e sustentação do eSocial.
                  - generic [ref=f1e251]: Ver detalhes do serviço
                - link [ref=f1e255] [cursor=pointer]:
                  - /url: /servicos/ltcat-laudo-tecnico-previdenciario
                  - heading "LTCAT | Laudo Técnico de Condições Ambientais do Trabalho" [level=4] [ref=f1e263]
                  - paragraph [ref=f1e264]: Documentação sólida para aposentadoria especial, PPP e eSocial S-2240. A SERMST realiza medições quantitativas, enquadramento técnico e entrega de LTCAT com base consistente para obrigações previdenciárias.
                  - generic [ref=f1e265]: Ver detalhes do serviço
                - link [ref=f1e269] [cursor=pointer]:
                  - /url: /servicos/laudo-insalubridade-nr15
                  - heading "Laudo de Insalubridade | Avaliação Técnica NR-15" [level=4] [ref=f1e277]
                  - paragraph [ref=f1e278]: Avaliação técnica para empresas que precisam entender a exposição ocupacional, documentar o enquadramento e manter folha, PGR, PCMSO e eSocial coerentes com a realidade do ambiente.
                  - generic [ref=f1e279]: Ver detalhes do serviço
                - link [ref=f1e283] [cursor=pointer]:
                  - /url: /servicos/laudo-periculosidade-nr16
                  - heading "Laudo de Periculosidade | Avaliação Técnica NR-16" [level=4] [ref=f1e291]
                  - paragraph [ref=f1e292]: Avaliação técnica das atividades e áreas de risco para empresas que precisam documentar o enquadramento da periculosidade e manter operação, folha, PGR e eSocial alinhados.
                  - generic [ref=f1e293]: Ver detalhes do serviço
                - link [ref=f1e297] [cursor=pointer]:
                  - /url: /servicos/gestao-esocial-s2220-s2240
                  - heading "Gestão completa de eSocial SST | S-2220 e S-2240" [level=4] [ref=f1e305]
                  - paragraph [ref=f1e306]: Gestão de eSocial SST para empresas que precisam controlar prazos, arquivos XML e erros de envio. A SERMST organiza S-2220 e S-2240 com processo, rastreabilidade e suporte ao RH.
                  - generic [ref=f1e307]: Ver detalhes do serviço
                - link [ref=f1e311] [cursor=pointer]:
                  - /url: /servicos/treinamentos-nrs-cipa-brigada
                  - heading "Treinamentos de NRs, CIPA e Brigada | Capacitação em SST" [level=4] [ref=f1e319]
                  - paragraph [ref=f1e320]: Treinamentos de NRs com conteúdo teórico e prático, emissão de certificados e controle das reciclagens. A SERMST oferece capacitação em CIPA, brigada e outros temas aplicáveis à operação.
                  - generic [ref=f1e321]: Ver detalhes do serviço
