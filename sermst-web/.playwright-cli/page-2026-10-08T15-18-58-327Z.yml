                  - paragraph [ref=f1e191]: "Exame toxicológico para empresas e condutores em São Paulo, com coleta para admissão, acompanhamento periódico, desligamento e exigências relacionadas à CNH nas categorias C, D e E. Preço de referência: R$ 200,00."
