          - heading "Serviços de SST para empresas que precisam de operação sem gargalo" [level=1] [ref=f1e54]: Serviços de SST para empresasque precisam de operação sem gargalo
          - paragraph [ref=f1e55]: Soluções em Saúde e Segurança do Trabalho para empresas que precisam contratar, regularizar documentos e manter o eSocial sob controle sem travar a operação.
      - generic [ref=f1e57]:
        - paragraph [ref=f1e58]: A SERMST oferece serviços completos de Medicina e Segurança do Trabalho para empresas de todos os portes em São Paulo e Grande ABC. Do exame admissional expresso, com ASO emitido no mesmo dia e laboratório clínico próprio, até a gestão documental de PGR, PCMSO, LTCAT e eSocial, cada serviço é estruturado para reduzir risco e manter a empresa em conformidade com o Ministério do Trabalho.
        - paragraph [ref=f1e59]:
          - text: Se ainda está definindo o escopo, conheça as
          - link "soluções de SST organizadas por necessidade" [ref=f1e60] [cursor=pointer]:
            - /url: /solucoes
          - text: antes de escolher um serviço específico.
        - paragraph [ref=f1e61]:
          - text: Empresas com funcionários CLT têm obrigações periódicas de SST que variam conforme o CNAE, o grau de risco e o número de empregados. Exame periódico, envio do S-2220, atualização de PCMSO e PGR e renovação de treinamentos obrigatórios fazem parte do ciclo anual de conformidade de qualquer empresa regularmente constituída. Quando esse controle precisa deixar de ser compra avulsa e virar rotina, os
          - link "Planos SST" [ref=f1e62] [cursor=pointer]:
            - /url: /assinaturas
          - text: ajudam a organizar vencimentos, exames e documentos em uma trilha recorrente.
        - paragraph [ref=f1e63]: Não sabe por onde começar? Use a Calculadora de Risco abaixo para identificar as obrigações de SST com base no CNAE da sua empresa antes de escolher o serviço.
        - paragraph [ref=f1e64]:
          - text: Para empresas com motoristas ou para pessoa física que busca
          - link "exame toxicológico para renovação de CNH C, D e E" [ref=f1e65] [cursor=pointer]:
            - /url: /servicos/exame-toxicologico-clt/sao-paulo
          - text: ", a SERMST também atende com fluxo claro, validade nacional e valor informado na própria página."
