                - link [ref=f1e196] [cursor=pointer]:
                  - /url: /servicos/exames-complementares-laboratoriais
                  - heading "Exames Complementares em SST | Laboratório Próprio" [level=4] [ref=f1e204]
                  - paragraph [ref=f1e205]: Exames complementares em medicina do trabalho com mais agilidade para o RH e menos deslocamento para o colaborador. A SERMST integra exames de sangue, visão, ECG, EEG e espirometria ao fluxo do ASO para acelerar a admissão e reforçar a conformidade.
                  - generic [ref=f1e206]: Ver detalhes do serviço
