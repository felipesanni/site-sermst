          - generic [ref=e106]:
            - generic [ref=e107]:
              - generic [ref=e108]: "01"
              - heading "O que faz o preço do LTCAT variar?" [level=2] [ref=e109]
            - generic [ref=e110]:
              - paragraph [ref=e111]: O trabalho pode variar conforme o número de estabelecimentos, os processos realizados em cada local, as funções e os grupos de trabalhadores expostos, os agentes identificados e os documentos já disponíveis. Operações distintas dentro da mesma empresa podem exigir levantamentos diferentes.
              - paragraph [ref=e112]: Também influenciam o orçamento as visitas técnicas, a necessidade de avaliação quantitativa para determinados agentes, o deslocamento, a análise dos registros de proteção e a organização dos dados que sustentam o PPP e o evento S-2240. A necessidade de cada etapa deve decorrer das condições avaliadas e do escopo, não de um pacote presumido.
          - generic [ref=e114]:
            - generic [ref=e115]:
              - generic [ref=e116]: "02"
              - heading "Número de empregados não define o escopo sozinho" [level=2] [ref=e117]
            - generic [ref=e118]:
              - paragraph [ref=e119]: A quantidade de trabalhadores ajuda a dimensionar a operação, mas não substitui a análise de atividades, ambientes e exposições. Uma empresa menor pode ter processos variados ou agentes que demandem investigação específica; uma empresa maior pode ter ambientes e funções semelhantes entre si.
              - paragraph [ref=e120]: Por isso, desconfie de comparações feitas apenas por trabalhador ou por CNPJ. Confirme se todas as propostas cobrem os mesmos estabelecimentos, grupos de exposição, avaliações e entregáveis.
          - generic [ref=e122]:
            - generic [ref=e123]:
              - generic [ref=e124]: "03"
              - heading "Como comparar propostas de LTCAT" [level=2] [ref=e125]
            - generic [ref=e126]:
              - paragraph [ref=e127]: "Peça que cada proposta esclareça os seguintes pontos:"
              - list [ref=e128]:
                - listitem [ref=e129]:
                  - strong [ref=e130]: "Unidades e atividades:"
                  - text: quais endereços e processos estão incluídos.
                - listitem [ref=e131]:
                  - strong [ref=e132]: "Grupos avaliados:"
                  - text: funções, tarefas e exposições que serão consideradas.
                - listitem [ref=e133]:
                  - strong [ref=e134]: "Metodologia:"
                  - text: levantamentos e medições previstos, quando aplicáveis, e condições em que serão realizados.
                - listitem [ref=e135]:
                  - strong [ref=e136]: "Responsabilidade técnica:"
                  - text: profissional responsável e identificação no documento.
                - listitem [ref=e137]:
                  - strong [ref=e138]: "Entregas e limites:"
                  - text: laudo, registros de avaliação, revisões, deslocamentos e itens cobrados à parte.
                - listitem [ref=e139]:
                  - strong [ref=e140]: "Prazo e dados de base:"
                  - text: informações que a empresa precisa fornecer e como mudanças futuras serão tratadas.
              - paragraph [ref=e141]: Um orçamento mais baixo pode ter um escopo menor. Compare as entregas e os limites por escrito antes de decidir; o valor não demonstra, sozinho, a adequação técnica do trabalho.
          - generic [ref=e143]:
            - generic [ref=e144]:
              - generic [ref=e145]: "04"
              - heading "LTCAT, PGR e laudo de insalubridade têm finalidades diferentes" [level=2] [ref=e146]
            - generic [ref=e147]:
              - paragraph [ref=e148]: O LTCAT documenta condições ambientais para fins previdenciários e serve de base para informações do PPP, conforme o caso. O PGR organiza o gerenciamento dos riscos ocupacionais; já o laudo de insalubridade avalia o enquadramento trabalhista segundo a NR-15. Um documento não substitui automaticamente o outro.
              - paragraph [ref=e149]:
                - text: Para entender as diferenças e o processo de avaliação, consulte o
                - link "guia do PPP eletrônico" [ref=e150] [cursor=pointer]:
                  - /url: /normas/ppp-eletronico
                - text: e a página sobre
                - link "insalubridade na NR-15" [ref=e151] [cursor=pointer]:
                  - /url: /normas/nr-15-insalubridade
                - text: .
          - generic [ref=e153]:
            - generic [ref=e154]:
              - generic [ref=e155]: "05"
              - heading "Quais dados reunir antes de pedir um orçamento" [level=2] [ref=e156]
            - generic [ref=e157]:
              - paragraph [ref=e158]: "Organize, quando disponíveis:"
              - list [ref=e159]:
                - listitem [ref=e160]: endereços e atividades de cada estabelecimento;
                - listitem [ref=e161]: relação de funções, tarefas e setores;
                - listitem [ref=e162]: processos, equipamentos, produtos e agentes presentes;
                - listitem [ref=e163]: PGR, avaliações ambientais, LTCAT e PPP existentes;
                - listitem [ref=e164]: registros de EPI e EPC e alterações recentes na operação;
                - listitem [ref=e165]: informações sobre avaliações ou medições anteriores.
              - paragraph [ref=e166]:
                - text: Com esses dados, o prestador pode esclarecer o que ainda precisa ser levantado. Conheça o
