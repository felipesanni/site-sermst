          - generic [ref=f2e106]:
            - generic [ref=f2e107]:
              - generic [ref=f2e108]: "01"
              - heading "O que é gestão de SST de verdade" [level=2] [ref=f2e109]
            - generic [ref=f2e110]:
              - paragraph [ref=f2e111]: "Gestão de SST integra os processos de saúde e segurança em uma sequência coerente: identificar os riscos, definir controles, treinar, acompanhar a saúde, registrar ocorrências e revisar o que precisa melhorar."
              - paragraph [ref=f2e112]: Um problema comum é deixar PGR, PCMSO, ASOs, treinamentos e eSocial em rotinas separadas. Os documentos existem, mas usam cargos, riscos ou datas diferentes. A gestão começa quando essas informações passam a conversar entre si.
          - generic [ref=f2e114]:
            - generic [ref=f2e115]:
              - generic [ref=f2e116]: "02"
              - heading "O ciclo de gestão de SST em 6 etapas" [level=2] [ref=f2e117]
            - generic [ref=f2e118]:
              - list [ref=f2e119]:
                - listitem [ref=f2e120]:
                  - strong [ref=f2e121]: Identificar.
                  - text: Mapear os perigos e riscos ocupacionais por ambiente, atividade e grupo de trabalhadores.
                - listitem [ref=f2e122]:
                  - strong [ref=f2e123]: Avaliar.
                  - text: Estimar o nível de risco com os critérios definidos no PGR e estabelecer prioridades.
                - listitem [ref=f2e124]:
                  - strong [ref=f2e125]: Controlar.
                  - text: Priorizar eliminação, substituição e proteção coletiva antes de depender do EPI.
                - listitem [ref=f2e126]:
                  - strong [ref=f2e127]: Documentar.
                  - text: PGR (riscos e controles), PCMSO (vigilância médica), ordens de serviço (instruções específicas), procedimentos de trabalho.
                - listitem [ref=f2e128]:
                  - strong [ref=f2e129]: Treinar.
                  - text: Atender às NRs aplicáveis e aos procedimentos da empresa, com conteúdo, instrutor, carga horária e registros adequados.
                - listitem [ref=f2e130]:
                  - strong [ref=f2e131]: Monitorar e melhorar.
                  - text: Acompanhar ocorrências, afastamentos, prazos e eficácia das medidas para ajustar o sistema.
              - paragraph [ref=f2e132]: Uma etapa depende da outra. Um PGR bem escrito perde utilidade se as medidas não chegam à operação; um treinamento sem registro dificulta a comprovação; um documento antigo pode deixar de representar o trabalho real.
          - generic [ref=f2e134]:
            - generic [ref=f2e135]:
              - generic [ref=f2e136]: "03"
              - heading "Os 4 documentos que sustentam a gestão" [level=2] [ref=f2e137]
            - generic [ref=f2e138]:
              - list [ref=f2e139]:
                - listitem [ref=f2e140]:
                  - strong [ref=f2e141]: "PGR (NR-01):"
                  - text: reúne inventário de riscos e plano de ação.
                - listitem [ref=f2e142]:
                  - strong [ref=f2e143]: "PCMSO (NR-07):"
                  - text: planeja o acompanhamento médico a partir dos riscos ocupacionais.
                - listitem [ref=f2e144]:
                  - strong [ref=f2e145]: "LTCAT:"
                  - text: sustenta informações previdenciárias relacionadas à exposição a agentes nocivos.
                - listitem [ref=f2e146]:
                  - strong [ref=f2e147]: "Ordens de serviço e procedimentos:"
                  - text: comunicam riscos, controles e orientações aplicáveis às atividades.
              - paragraph [ref=f2e148]: Esses documentos têm finalidades diferentes, mas os dados básicos sobre funções, ambientes, riscos e controles precisam ser coerentes.
          - generic [ref=f2e150]:
            - generic [ref=f2e151]:
              - generic [ref=f2e152]: "04"
              - heading "eSocial é o termômetro da gestão" [level=2] [ref=f2e153]
            - generic [ref=f2e154]:
              - paragraph [ref=f2e155]: Os eventos de SST do eSocial, como S-2210, S-2220 e S-2240, refletem dados produzidos ao longo da gestão. Quando o cadastro, os exames e as avaliações ambientais estão organizados, o envio tende a exigir menos correções.
              - paragraph [ref=f2e156]: Atrasos, rejeições e divergências entre o evento e o documento de origem costumam indicar falhas no processo anterior ao envio. Corrigir apenas o arquivo transmitido não resolve a causa.
          - generic [ref=f2e158]:
            - generic [ref=f2e159]:
              - generic [ref=f2e160]: "05"
              - heading "Os 5 sinais de que a sua gestão está frágil" [level=2] [ref=f2e161]
            - generic [ref=f2e162]:
              - list [ref=f2e163]:
                - listitem [ref=f2e164]:
                  - strong [ref=f2e165]: O PGR foi feito uma vez e ninguém revisou desde.
                - listitem [ref=f2e166]:
                  - strong [ref=f2e167]: Os ASOs estão arquivados sem ninguém olhar tendência.
                - listitem [ref=f2e168]:
                  - strong [ref=f2e169]: Treinamentos estão vencidos ou nunca foram dados formalmente.
                - listitem [ref=f2e170]:
                  - strong [ref=f2e171]: Os eventos do eSocial saem com erro recorrente.
                - listitem [ref=f2e172]:
                  - strong [ref=f2e173]: Quando alguém pergunta "o que muda no SST porque temos uma máquina nova", ninguém sabe responder.
              - paragraph [ref=f2e174]: Um sinal isolado já merece atenção. Quando vários aparecem ao mesmo tempo, vale fazer uma revisão estruturada dos documentos e da rotina operacional.
          - generic [ref=f2e176]:
            - generic [ref=f2e177]:
              - generic [ref=f2e178]: "06"
              - heading "Como começar a estruturar gestão de SST" [level=2] [ref=f2e179]
            - list [ref=f2e181]:
              - listitem [ref=f2e182]:
                - strong [ref=f2e183]: Revisar o que existe hoje.
                - text: Confira se cada documento está atualizado, representa a operação e tem a responsabilidade técnica aplicável.
              - listitem [ref=f2e184]:
                - strong [ref=f2e185]: Definir um responsável interno.
                - text: Pode ser RH, DP, gerente de operação, ou cargo dedicado em empresa maior. Sem dono, o sistema não funciona.
              - listitem [ref=f2e186]:
                - strong [ref=f2e187]: Definir o apoio técnico.
                - text: A empresa pode usar equipe própria, profissionais externos ou uma combinação dos dois, conforme o porte e o dimensionamento legal.
              - listitem [ref=f2e188]:
                - strong [ref=f2e189]: Definir cronograma.
                - text: Quais documentos precisam ser revisados quando. Quais exames fazem aniversário em qual mês. Quais treinamentos vencem.
              - listitem [ref=f2e190]:
                - strong [ref=f2e191]: Criar painel de indicadores.
                - text: Conformidade documental, taxa de exame em dia, treinamentos atualizados, eventos eSocial no prazo. Olhar mensal.
              - listitem [ref=f2e192]:
                - strong [ref=f2e193]: Fazer análise crítica periódica.
                - text: A direção e os responsáveis revisam os resultados e ajustam prioridades.
